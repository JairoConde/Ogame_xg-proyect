services:
  xgproyect-v3:
    build:
      context: .
      args:
        PHP_VERSION: 8.2
    container_name: xgproyect-v3
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - .:/var/www/html
    depends_on:
      - db
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
      # Opcional: reutilizar modelos ya descargados en WSL (ruta absoluta en TU home):
      # - /home/jairoconde/.ollama:/root/.ollama
    # API solo en la red Docker (bot / llm-worker). No publica 11434 en el host → no choca con Ollama systemd en WSL.
    expose:
      - "11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  bot:
    build:
      context: .
      args:
        PHP_VERSION: 8.2
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - db
      - ollama
    environment:
      BOT_LLM_ENABLED: "1"
      BOT_LLM_URL: "http://ollama:11434"
      BOT_LLM_MODEL: "llama3.1:8b-instruct-q4_K_M"
      BOT_LLM_TIMEOUT_SEC: "90"
    command: >
      sh -c "sleep 10 &&
      php scripts/simple_rule_bot.php
      --config scripts/bot_accounts.json
      --forever
      --sleep 10"
  llm-worker:
    build:
      context: .
      args:
        PHP_VERSION: 8.2
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - db
      - ollama
    environment:
      BOT_LLM_ENABLED: "1"
      BOT_LLM_URL: "http://ollama:11434"
      BOT_LLM_MODEL: "llama3.1:8b-instruct-q4_K_M"
      BOT_LLM_TIMEOUT_SEC: "90"
      BOT_LLM_LOG_PROMPTS: "1"
    command: >
      sh -c "sleep 15 &&
      stdbuf -oL -eL php -d output_buffering=0 scripts/llm_worker.php --forever --sleep 3"
  db:
    image: mysql:5.7
    restart: on-failure
    ports:
      - 33060:3306
    volumes:
      - db_data:/var/lib/mysql
      - ./data:/docker-entrypoint-initdb.d
    environment:
      MYSQL_DATABASE: xgp
      MYSQL_ROOT_PASSWORD: root
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - 8081:80
    environment:
      MYSQL_ROOT_PASSWORD: root
      PMA_HOST: db
  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    restart: on-failure
    ports:
      - 1025:1025 # smtp server
      - 8025:8025 # web ui

volumes:
  db_data:
  ollama_data:
